name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include personal information (user names in paths, e-mail addresses).
        For security problems, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click Templates
        2. Add "Open Git Bash here"
        3. Right-click the desktop
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type winver
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or exported entries
      description: Optional. Remove anything private first.
